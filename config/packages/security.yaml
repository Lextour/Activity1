security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "auto"

    providers:
        users_in_memory:
            memory:
                users:
                    admin:
                        password: "$2y$13$WrYvV9q9CCuK3pKK5eBZBeBSj0q.QjZQe8p6pWq9Y5t5a5t5a5t5a" # admin123
                        roles: ["ROLE_ADMIN"]
                    user:
                        password: "$2y$13$abc123def456ghi789jklmnoPQRSTUVWXYZ0123456789abcd" # user123
                        roles: ["ROLE_USER"]

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            http_basic: ~
            logout:
                path: /logout
                target: /

    access_control:
        - { path: ^/dashboard, roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
